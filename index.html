<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Header & Greeting (Challenge: Custom Name & Light/Dark Mode) -->
    <header class="card header-card">
      <div class="header-top">
        <div id="clock" class="clock">00:00:00</div>
        <button id="theme-toggle" class="btn btn-secondary" title="Ganti Tema">🌙 Dark Mode</button>
      </div>
      <div id="date" class="date">Memuat tanggal...</div>
      <div class="greeting-box">
        <h1 id="greeting-text">Selamat Datang!</h1>
        <button id="edit-name-btn" class="btn-icon" title="Ubah Nama">✏️</button>
      </div>
    </header>

    <main class="grid-layout">
      <!-- Focus Timer (25 Menit Pomodoro) -->
      <section class="card timer-card">
        <h2>Focus Timer</h2>
        <div id="timer-display" class="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="start-timer" class="btn btn-primary">Start</button>
          <button id="stop-timer" class="btn btn-warning">Stop</button>
          <button id="reset-timer" class="btn btn-secondary">Reset</button>
        </div>
      </section>

      <!-- Quick Links -->
      <section class="card links-card">
        <h2>Quick Links</h2>
        <form id="link-form" class="inline-form">
          <input type="text" id="link-name" placeholder="Nama (mis. GitHub)" required />
          <input type="url" id="link-url" placeholder="https://..." required />
          <button type="submit" class="btn btn-primary">Tambah</button>
        </form>
        <div id="links-container" class="links-grid"></div>
      </section>

      <!-- To-Do List (Challenge: Prevent Duplicate Tasks) -->
      <section class="card todo-card">
        <h2>To-Do List</h2>
        <form id="todo-form" class="inline-form">
          <input type="text" id="todo-input" placeholder="Tulis tugas baru..." required />
          <button type="submit" class="btn btn-primary">Tambah</button>
        </form>
        <p id="todo-error" class="error-msg"></p>
        <ul id="todo-list" class="todo-list"></ul>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
